package:
  name: "qteasy-ai"
  version: "0.1.0"

source:
  git_rev: v0.1.0
  git_url: https://github.com/shepherdpp/qteasy-ai

requirements:
  host:
    - python
    - setuptools
  build:
    - python
  run:
    - python
    - pandas>=1.5.0
    - numpy>=1.18.1
    - numba>=0.47.0

about:
  home: https://github.com/shepherdpp/qteasy-ai
  documentation: https://qteasy.readthedocs.io/zh-cn/latest/
  license: BSD 3-Clause
  license_familY: BSD
  license_file: LICENSE
  summary: "AI orchestration shell for qteasy — natural language plans over qteasy APIs"

extra:
  recipe-maintainers:
    - shepherdpp